<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres salir? ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .caja {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff4d6d;
            font-size: 32px;
        }

        #mensaje {
            font-size: 21px;
            min-height: 80px;
            color: #444;
            margin: 25px 0;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        #si {
            background: #4CAF50;
            color: white;
        }

        #no {
            background: #f44336;
            color: white;
        }

        button:hover {
            transform: scale(1.08);
        }

        #resultado {
            font-size: 28px;
            font-weight: bold;
            color: #ff4081;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="caja">

        <h1>🌹 ¿Quieres salir a dar un paseo conmigo? 🌹</h1>

        <div id="mensaje">
            Piénsalo bien... sería bonito salir juntos 🥺❤️
        </div>

        <div class="botones">
            <button id="si" onclick="aceptar()">Sí, quiero salir ❤️</button>

            <button id="no" onclick="rechazar()">No quiero 😐</button>
        </div>

        <div id="resultado"></div>

    </div>


    <script>

        let rechazos = 0;

        const mensajes = [
            "¿Seguro que no quieres? 🥺",
            "Por favor... dame una oportunidad 😭❤️",
            "Vamos, será solo un paseíto 🥹",
            "Te prometo que será divertido 😭🙏",
            "Por favor, por favor, por favor 😭❤️",
            "Mira que me voy a poner triste... 🥺💔",
            "¿De verdad vas a decir que no otra vez? 😭",
            "Yo solo quería pasar un ratito contigo 🥹❤️",
            "POR FAVOR 😭🙏 ¡ACEPTA!",
            "Ya me estás rompiendo el corazón 💔😭",
            "Una última oportunidad... ¿sí? 🥺❤️",
            "TE LO RUEGO 😭😭😭",
            "¿Cuántas veces tengo que rogar? 😭💔",
            "Bueno... seguiré insistiendo hasta que digas que sí 😈❤️"
        ];


        function rechazar() {

            rechazos++;

            // Elegir mensaje según la cantidad de veces que diga NO
            let posicion = rechazos - 1;

            if (posicion >= mensajes.length) {
                posicion = mensajes.length - 1;
            }

            document.getElementById("mensaje").innerHTML =
                mensajes[posicion];

            document.getElementById("resultado").innerHTML = "";

            // Hacer que el botón NO cambie un poco de tamaño
            const botonNo = document.getElementById("no");

            if (rechazos >= 3) {
                botonNo.style.transform =
                    "scale(" + (1 - rechazos * 0.03) + ")";
            }

            // Después de varios NO, el botón SÍ se hace más grande
            const botonSi = document.getElementById("si");

            if (rechazos >= 3) {
                botonSi.style.transform =
                    "scale(" + (1 + rechazos * 0.04) + ")";
            }
        }


        function aceptar() {

            document.getElementById("mensaje").innerHTML =
                "🎉 ¡FELICITACIONES! 🎉";

            document.getElementById("resultado").innerHTML =
                "Hoy no puedo 😈😂<br><br>" +
                "¡Pero gracias por aceptar! ❤️";

            // Ocultar los botones
            document.querySelector(".botones").style.display = "none";
        }

    </script>

</body>
</html>
```
